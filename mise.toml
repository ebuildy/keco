#:schema https://mise.jdx.dev/schema/mise.json
# Keco — dev toolchain and task runner.
# Every dev script in this repo is a mise task; nothing is invoked ad-hoc.

[tools]
node = "24.18.1"
pnpm = "11.18.0"

[env]
# NODE_ENV is deliberately not set here. Vite and Fastify each set their own (vite dev →
# development, vite build → production), and exporting one globally overrides both.
#
# Loaded from .env when present (created by `mise run setup`).
#
# Deliberately NOT `{ path = ".env", redact = true }`: that masks every value from this
# file by plain substring match, with no idea which are sensitive — SHARD_INDEX=0 alone
# redacts every digit 0 in every task's output. Per-key redaction (`redactions = [...]`)
# needs a mise newer than 2026.7.5; no task here echoes a secret, and .env is gitignored.
_.file = ".env"

[settings]
experimental = true

# ── setup ────────────────────────────────────────────────────────────────────

[tasks.setup]
description = "First-run bootstrap: .env, dependencies, Meilisearch, index settings, browser search key"
depends = ["env:init", "install"]
run = [
  "mise run infra:up",
  "mise run search:settings",
  "mise run search:key",
]

[tasks."env:init"]
description = "Create .env from .env.example if missing"
run = 'test -f .env || (cp .env.example .env && echo "created .env — fill in GITHUB_TOKEN")'

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "*/*/package.json"]
outputs = { auto = true }

# ── dev ──────────────────────────────────────────────────────────────────────

[tasks.web]
description = "Portal dev server (Vite) on :5173, proxying /api to :3000"
run = "pnpm -F @keco/web dev"

[tasks."web:mock"]
description = "Portal dev server on :5173 with the mock backend — fabricated data, dev only, never in a production build"
run = "pnpm -F @keco/web dev:mock"

[tasks.api]
description = "Fastify API + static portal on :3000"
run = "pnpm -F @keco/api dev"

[tasks.dev]
description = "Portal (:5173) and API (:3000) together"
# depends runs these in parallel; `run` would chain them and the first would never exit.
depends = ["web", "api"]

[tasks.prerender]
description = "Emit static tool pages, sitemap.xml and robots.txt from the read model"
run = "pnpm -F @keco/web prerender"

[tasks.build]
description = "Build the portal, prerender the top tool pages, typecheck the API"
# Order matters: `vite build` empties dist/, which would delete a previous prerender.
run = [
  # mockServiceWorker.js is generated locally by `mise run web:mock` (msw init) and gitignored,
  # but `vite build` copies public/ into dist/ verbatim regardless of DEV/VITE_MOCK — so a
  # machine that has ever run the mock leaves this file behind for every later build. Drop it
  # before building. assert:no-mocks below still runs and is the real backstop; this step is
  # hygiene, not a substitute for it.
  "rm -f apps/web/public/mockServiceWorker.js",
  "pnpm -F @keco/web build",
  "pnpm -F @keco/web prerender",
  "pnpm -F @keco/web assert:no-mocks",
  "pnpm -F @keco/api check",
]

[tasks."admin:hash"]
description = "Hash a password for ADMIN_PASSWORD_HASH. Args: --password 'secret'"
run = "pnpm -F @keco/api admin:hash"

# ── quality gates (§15 definition of done) ───────────────────────────────────

[tasks.check]
description = "Typecheck the whole workspace"
run = "pnpm -r --parallel check"

[tasks.lint]
description = "Lint (includes the import-boundary rules of §7)"
run = "pnpm eslint ."

[tasks.test]
description = "Run the test suite"
run = "pnpm vitest run"

[tasks."test:watch"]
description = "Run the test suite in watch mode"
run = "pnpm vitest"

[tasks."e2e:install"]
description = "Download the Chromium build Playwright drives (cached; a no-op once present)"
run = "pnpm -F @keco/web exec playwright install chromium"

[tasks.e2e]
description = "Portal end-to-end tests (Playwright, Chromium) against the in-browser mock backend — no Meilisearch, no API, no GitHub token. Args: --ui, --headed, or a path"
depends = ["e2e:install"]
run = "pnpm -F @keco/web e2e"

[tasks."taxonomy:check"]
description = "Validate packages/core/taxonomy.yaml (schema, duplicates, unknown defaults)"
run = "pnpm -F @keco/core taxonomy:check"

[tasks.ci]
description = "Everything that must be green before declaring work done"
depends = ["check", "lint", "test", "taxonomy:check"]

[tasks.format]
description = "Format sources with prettier"
run = "pnpm prettier --write ."

# ── write side: the three workers ────────────────────────────────────────────

[tasks.discovery]
description = "Enumerate every GitHub repo matching a keyword into discovery/{query}/*.yaml — one namespace per keyword, so several can share a cache. Resumes by default. Args: --query kubernetes --fresh (starts this keyword's sweep over, leaving the others alone) --limit 500 (stops at the first window boundary past 500 total repos, so it overshoots and is for dev runs only)"
run = "pnpm -F @keco/workers discovery"

[tasks.crawler]
description = "Discover + fetch repos into the cache. Args: --seed cncf,krew --limit 200"
run = "pnpm -F @keco/workers crawler"

[tasks.analyzer]
description = "Classify everything with a changed content_hash or an expired signal TTL"
run = "pnpm -F @keco/workers analyzer"

[tasks.projector]
description = "Project analyses into Meilisearch. Args: --rebuild for a full replay + alias swap"
run = "pnpm -F @keco/workers projector"

[tasks.replay]
description = "Reset a consumer checkpoint. Args: --consumer analyzer"
run = "pnpm -F @keco/workers replay"

[tasks.rebuild]
description = "Full offline rebuild of the read model from cache (no GitHub calls)"
run = "pnpm -F @keco/workers projector --rebuild"

[tasks.pipeline]
description = "Small end-to-end run: crawl 200 seeded repos, analyze, project"
run = [
  "pnpm -F @keco/workers crawler --seed cncf,krew --limit 200",
  "pnpm -F @keco/workers analyzer",
  "pnpm -F @keco/workers projector",
]

# ── read side / infra ────────────────────────────────────────────────────────

[tasks."search:settings"]
description = "Apply Meilisearch index settings (idempotent)"
run = "pnpm -F @keco/search settings"

[tasks."search:key"]
description = "Mint or fetch the browser's search-only Meilisearch key (tools index) and write VITE_MEILI_SEARCH_KEY into .env — idempotent, never overwrites a value already set"
run = "pnpm -F @keco/search ensure-search-key"

[tasks."infra:up"]
description = "Start Meilisearch"
run = "docker compose -f infra/compose.yml up -d"

[tasks."infra:down"]
description = "Stop Meilisearch"
run = "docker compose -f infra/compose.yml down"

[tasks."infra:reset"]
description = "Stop Meilisearch and delete its volume (the index is disposable)"
run = "docker compose -f infra/compose.yml down -v"
