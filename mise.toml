#:schema https://mise.jdx.dev/schema/mise.json
# Keco — dev toolchain and task runner.
# Every dev script in this repo is a mise task; nothing is invoked ad-hoc.

[tools]
node = "24.18.1"
pnpm = "11.18.0"

[env]
# NODE_ENV is deliberately not set here: exporting "development" globally leaks into
# `next build`, which then warns about a non-standard NODE_ENV and prerenders in dev mode.
# Each tool sets its own (next dev → development, next build → production).
#
# Loaded from .env when present (created by `mise run setup`).
#
# Deliberately NOT `{ path = ".env", redact = true }`: that masks every value from this
# file by plain substring match, with no idea which are sensitive — SHARD_INDEX=0 alone
# redacts every digit 0 in every task's output. Per-key redaction (`redactions = [...]`)
# needs a mise newer than 2026.7.5; no task here echoes a secret, and .env is gitignored.
_.file = ".env"

[settings]
experimental = true

# ── setup ────────────────────────────────────────────────────────────────────

[tasks.setup]
description = "First-run bootstrap: .env, dependencies, Meilisearch, index settings"
depends = ["env:init", "install"]
run = [
  "mise run infra:up",
  "mise run search:settings",
]

[tasks."env:init"]
description = "Create .env from .env.example if missing"
run = 'test -f .env || (cp .env.example .env && echo "created .env — fill in GITHUB_TOKEN")'

[tasks.install]
description = "Install workspace dependencies"
run = "pnpm install"
sources = ["package.json", "pnpm-lock.yaml", "*/*/package.json"]
outputs = { auto = true }

# ── dev ──────────────────────────────────────────────────────────────────────

[tasks.dev]
description = "Next.js portal + backoffice on :3000"
run = "pnpm -F @keco/web dev"

[tasks.build]
description = "Build the web app"
run = "pnpm -F @keco/web build"

# ── quality gates (§15 definition of done) ───────────────────────────────────

[tasks.check]
description = "Typecheck the whole workspace"
run = "pnpm -r --parallel check"

[tasks.lint]
description = "Lint (includes the import-boundary rules of §7)"
run = "pnpm eslint ."

[tasks.test]
description = "Run the test suite"
run = "pnpm vitest run"

[tasks."test:watch"]
description = "Run the test suite in watch mode"
run = "pnpm vitest"

[tasks."taxonomy:check"]
description = "Validate packages/core/taxonomy.yaml (schema, duplicates, unknown defaults)"
run = "pnpm -F @keco/core taxonomy:check"

[tasks.ci]
description = "Everything that must be green before declaring work done"
depends = ["check", "lint", "test", "taxonomy:check"]

[tasks.format]
description = "Format sources with prettier"
run = "pnpm prettier --write ."

# ── write side: the three workers ────────────────────────────────────────────

[tasks.discovery]
description = "Enumerate GitHub repos matching a keyword into discovery/*.yaml. Args: --query kubernetes --limit 500 --fresh"
run = "pnpm -F @keco/workers discovery"

[tasks.crawler]
description = "Discover + fetch repos into the cache. Args: --seed cncf,krew --limit 200"
run = "pnpm -F @keco/workers crawler"

[tasks.analyzer]
description = "Classify everything with a changed content_hash or an expired signal TTL"
run = "pnpm -F @keco/workers analyzer"

[tasks.projector]
description = "Project analyses into Meilisearch. Args: --rebuild for a full replay + alias swap"
run = "pnpm -F @keco/workers projector"

[tasks.replay]
description = "Reset a consumer checkpoint. Args: --consumer analyzer"
run = "pnpm -F @keco/workers replay"

[tasks.rebuild]
description = "Full offline rebuild of the read model from cache (no GitHub calls)"
run = "pnpm -F @keco/workers projector --rebuild"

[tasks.pipeline]
description = "Small end-to-end run: crawl 200 seeded repos, analyze, project"
run = [
  "pnpm -F @keco/workers crawler --seed cncf,krew --limit 200",
  "pnpm -F @keco/workers analyzer",
  "pnpm -F @keco/workers projector",
]

# ── read side / infra ────────────────────────────────────────────────────────

[tasks."search:settings"]
description = "Apply Meilisearch index settings (idempotent)"
run = "pnpm -F @keco/search settings"

[tasks."infra:up"]
description = "Start Meilisearch"
run = "docker compose -f infra/compose.yml up -d"

[tasks."infra:down"]
description = "Stop Meilisearch"
run = "docker compose -f infra/compose.yml down"

[tasks."infra:reset"]
description = "Stop Meilisearch and delete its volume (the index is disposable)"
run = "docker compose -f infra/compose.yml down -v"
