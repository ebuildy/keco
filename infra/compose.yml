# Local dev infrastructure: the read model.
#
# The write model needs no service — it is a directory (`.cache/`) behind the storage port
# in packages/cache. Object storage arrives with the deployment that needs it (ROADMAP.md).
#
# Both are disposable: `mise run infra:reset` wipes the index, `rm -rf .cache` wipes the
# cache, and the pipeline rebuilds either one.

services:
  meilisearch:
    image: getmeili/meilisearch:v1.24
    container_name: keco-meilisearch
    ports:
      - '7700:7700'
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-keco-dev-master-key}
      MEILI_ENV: development
      MEILI_NO_ANALYTICS: 'true'
    volumes:
      - meili:/meili_data
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7700/health']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  meili:
