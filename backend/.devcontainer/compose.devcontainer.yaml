# Dev Container-specific overrides: turn on Xdebug's step-debugging mode (compose.dev.yaml
# only enables its lightweight "develop" mode for a plain `docker compose up`).
services:
  php:
    environment:
      XDEBUG_MODE: "${XDEBUG_MODE:-develop,debug}"
      XDEBUG_CONFIG: "client_host=127.0.0.1 start_with_request=yes"
