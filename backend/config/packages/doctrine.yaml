doctrine:
    dbal:
        url: '%env(resolve:DATABASE_URL)%'

        # IMPORTANT: You MUST configure your server version,
        # either here or in the DATABASE_URL env var (see .env file)
        #server_version: '16'

        profiling_collect_backtrace: '%kernel.debug%'

        # messenger_messages (config/packages/messenger.yaml's Doctrine transport) is real SQL
        # in a migration, not an ORM entity — nothing under src/Entity maps to it, deliberately,
        # since it's Messenger's table, not part of the write model. Without this filter,
        # `doctrine:schema:validate` and `doctrine:migrations:diff` both see it (and its
        # auto-increment sequence, `messenger_messages_id_seq`) as stray and want to drop them.
        schema_filter: '~^(?!messenger_messages)~'

        # JournalEvent.id and Checkpoint.last_event_id are ULIDs (AGENTS.md §3): the type maps
        # to Postgres' native `uuid` column and stores the ULID's 128-bit value, so ordering by
        # the column is the same as ordering by the ULID itself — the indexed range read the
        # journal's append/read contract depends on.
        types:
            ulid: Symfony\Bridge\Doctrine\Types\UlidType
    orm:
        validate_xml_mapping: true
        naming_strategy: doctrine.orm.naming_strategy.underscore
        identity_generation_preferences:
            Doctrine\DBAL\Platforms\PostgreSQLPlatform: identity
        auto_mapping: true
        mappings:
            App:
                type: attribute
                is_bundle: false
                dir: '%kernel.project_dir%/src/Entity'
                prefix: 'App\Entity'
                alias: App

when@test:
    doctrine:
        dbal:
            # "TEST_TOKEN" is typically set by ParaTest
            dbname_suffix: '_test%env(default::TEST_TOKEN)%'

when@prod:
    doctrine:
        orm:
            query_cache_driver:
                type: pool
                pool: doctrine.system_cache_pool
            result_cache_driver:
                type: pool
                pool: doctrine.result_cache_pool

    framework:
        cache:
            pools:
                doctrine.result_cache_pool:
                    adapter: cache.app
                doctrine.system_cache_pool:
                    adapter: cache.system
