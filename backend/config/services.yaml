# yaml-language-server: $schema=../vendor/symfony/dependency-injection/Loader/schema/services.schema.json

# This file is the entry point to configure your own services.
# Files in the packages/ subdirectory configure your dependencies.
# See also https://symfony.com/doc/current/service_container/import.html

# Put parameters here that don't need to change on each machine where the app is deployed
# https://symfony.com/doc/current/best_practices.html#use-parameters-for-application-configuration
parameters:
    # AGENTS.md §6: the one taxonomy file, shared unchanged by backend/ (PHP) and apps/web (JS),
    # living at the repo root rather than under backend/.
    app.taxonomy_path: '%kernel.project_dir%/../taxonomy/taxonomy.yaml'

services:
    # default configuration for services in *this* file
    _defaults:
        autowire: true      # Automatically injects dependencies in your services.
        autoconfigure: true # Automatically registers your services as commands, event subscribers, etc.

    # makes classes in src/ available to be used as services
    # this creates a service per class whose id is the fully-qualified class name
    App\:
        resource: '../src/'

    # add more service definitions when explicit configuration is needed
    # please note that last definitions always *replace* previous ones

    # Meilisearch (AGENTS.md §5, §11): the read model's client. `Meilisearch\Client` is vendor
    # code, so it can't carry a #[Autowire] attribute on its constructor — this is the "type-hint
    # can't express it" case AGENTS.md calls out, and explicit YAML is the right tool for it, not
    # a last resort worked around. $httpClient/$requestFactory/$streamFactory autowire on their
    # own (symfony/http-client's PSR-18 bridge + php-http/discovery's PSR-17 factory, see
    # config/packages/http_discovery.yaml); only the scalar $url/$apiKey need binding here.
    # `App\Search` builds its index-specific wrapper (settings, rebuild, alias swap) on top of
    # this service once the Projector lands (Phase 4+) — see docs/superpowers/specs/
    # 2026-09-12-php-symfony-migration-design.md.
    Meilisearch\Client:
        arguments:
            $url: '%env(MEILI_HOST)%'
            $apiKey: '%env(MEILI_MASTER_KEY)%'
