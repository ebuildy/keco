name: backend image

# Builds backend/'s production image (the frankenphp_prod stage of backend/Dockerfile — AGENTS.md
# §7's "two deployables"), generates its SBOM and scans it for known vulnerabilities, both with
# Trivy (aquasecurity/trivy-action). Pull requests build and scan only. Pushes to main and version
# tags additionally push to GHCR — gated on the vulnerability scan passing, so a CRITICAL/HIGH
# finding blocks the push but still leaves the SBOM and scan results behind as artifacts.
#
# Third-party actions (docker/*, aquasecurity/*) are pinned by commit SHA, not just a version tag
# — this workflow's whole job is supply-chain hygiene, so its own supply chain gets the same
# treatment. First-party GitHub actions (actions/*, github/*) are pinned by major version tag,
# the same convention @AGENTS.md's dependency-management guidance uses everywhere else.

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - 'taxonomy/**'
      - '.github/workflows/backend-image.yml'
  pull_request:
    paths:
      - 'backend/**'
      - 'taxonomy/**'
      - '.github/workflows/backend-image.yml'
  workflow_dispatch: {}

concurrency:
  group: backend-image-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}-backend

permissions:
  contents: read

jobs:
  build-scan:
    name: Build, SBOM, scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push to GHCR on main/tags
      security-events: write # upload the Trivy SARIF to the Security tab
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # frankenphp_prod is the deployable stage: it bakes in vendor/ and app source, unlike
      # frankenphp_dev which relies on a bind mount. Build context is the monorepo root — see
      # backend/Dockerfile's own header comment on why every COPY in it is rooted there.
      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          target: frankenphp_prod
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pick the primary image tag to scan
        id: primary
        run: echo "tag=$(head -n1 <<< '${{ steps.meta.outputs.tags }}')" >> "$GITHUB_OUTPUT"

      - name: Generate SBOM (SPDX JSON)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.primary.outputs.tag }}
          format: spdx-json
          output: sbom.spdx.json

      - name: Upload SBOM artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-image-sbom
          path: sbom.spdx.json
          retention-days: 90

      - name: Scan for vulnerabilities (report)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.primary.outputs.tag }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0' # this run only reports; the gate step below decides pass/fail

      - name: Upload scan artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-image-trivy-sarif
          path: trivy-results.sarif
          retention-days: 90

      - name: Upload scan results to the Security tab
        if: always()
        continue-on-error: true # needs GitHub Advanced Security on a private repo; never block on it
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          sarif_file: trivy-results.sarif

      # Gate, run last so both reports above are already saved: a failing scan still leaves the
      # SBOM and SARIF as artifacts (and, where available, in the Security tab) behind it, and a
      # failure here stops the job before the push steps run.
      - name: Fail on CRITICAL/HIGH vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.primary.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] && docker push "$tag"
          done <<< '${{ steps.meta.outputs.tags }}'
