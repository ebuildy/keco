packages:
  - "apps/*"
  - "packages/*"

# esbuild powers tsx/vitest. unrs-resolver is not needed.
allowBuilds:
  esbuild: true
  unrs-resolver: false

minimumReleaseAgeExclude:
  - '@octokit/graphql@9.0.4'
  - '@octokit/openapi-types@28.0.0'
  - '@octokit/request-error@7.1.1'
  - '@octokit/request@10.0.13'
  - '@octokit/types@17.0.0'
